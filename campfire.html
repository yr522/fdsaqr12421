<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캠프파이어 동료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: 카카오톡식 채팅이 메인, 오른쪽에 일지(설정) 패널. 좁은 화면에선 패널이 서랍으로. */
:root{
  --night:#0f0c10;        /* 바탕 */
  --hide:#18131a;         /* 패널 가죽 */
  --hide-2:#211a23;       /* 입력칸/AI 말풍선 */
  --line:#3a2f33;         /* 경계선 */
  --gold:#c9a35a;         /* 금박 */
  --gold-dim:#8a6f3d;
  --ink:#ebe0cb;          /* 본문 */
  --ink-mute:#9a8c78;
  --ember:#d9763f;        /* 모닥불 */
  --danger:#c0574a;
  --f-display:"Cinzel", "Noto Serif KR", Georgia, serif;
  --f-body:"Noto Serif KR", "Apple SD Gothic Neo", Georgia, serif;
  --f-ui:"Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}

/* ── 채팅 ── */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 115%, rgba(217,118,63,.13), transparent 60%),
    radial-gradient(80% 60% at 50% -10%, rgba(201,163,90,.06), transparent 70%),
    var(--night)}
.chat-head{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:rgba(15,12,16,.85);backdrop-filter:blur(6px)}
.chat-head .who{flex:1;min-width:0}
.chat-head .name{font-family:var(--f-display);font-size:17px;letter-spacing:.06em;color:var(--gold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .status{font-size:12px;color:var(--ink-mute);display:flex;align-items:center;gap:6px}
.chat-head .status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember)}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 11px;cursor:pointer;
  color:var(--ink-mute);font-size:13px;white-space:nowrap}
.icon-btn:hover{color:var(--gold);border-color:var(--gold-dim)}
.only-narrow{display:none}

.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, #3a2c33, #1a1418);border:1.5px solid var(--gold-dim);
  font-family:var(--f-display);color:var(--gold);font-size:17px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

.log{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 8px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;margin:14px 0 10px;font-size:12px;color:var(--ink-mute);padding:4px 14px;
  border:1px solid var(--line);border-radius:999px;background:rgba(24,19,26,.7)}
.row{display:flex;gap:9px;align-items:flex-start;max-width:100%}
.row.me{justify-content:flex-end}
.row.grp-start{margin-top:10px}
.row .avatar{width:38px;height:38px;font-size:15px}
.row .spacer{width:38px;flex:none}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:min(72%,560px)}
.row.me .stack{align-items:flex-end}
.sender{font-size:12px;color:var(--ink-mute);margin-left:2px}
.line{display:flex;align-items:flex-end;gap:6px}
.row.me .line{flex-direction:row-reverse}
.bubble{padding:9px 13px;border-radius:14px;line-height:1.65;font-family:var(--f-body);font-size:15px;
  white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.row.them .bubble{background:var(--hide-2);border:1px solid #3d3238;border-top-left-radius:4px}
.row.them:not(.grp-start) .bubble{border-top-left-radius:14px}
.row.me .bubble{background:linear-gradient(160deg,#d4b06a,#b08a45);color:#1d150c;border-top-right-radius:4px}
.row.me:not(.grp-start) .bubble{border-top-right-radius:14px}
.bubble em{color:var(--ink-mute);font-style:italic}
.row.me .bubble em{color:#4a3a22}
.meta{font-size:11px;color:var(--ink-mute);white-space:nowrap;padding-bottom:2px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row.them .meta{align-items:flex-start}
.stats{font-size:10.5px;color:var(--gold-dim);font-variant-numeric:tabular-nums}
.reroll{border:0;background:none;color:var(--gold-dim);cursor:pointer;font-size:11px;padding:0}
.reroll:hover{color:var(--gold)}
.notice{align-self:center;max-width:90%;text-align:center;font-size:12.5px;color:#e6b3a8;
  border:1px solid rgba(192,87,74,.5);background:rgba(192,87,74,.1);padding:8px 14px;border-radius:10px;margin:8px 0}

.typing{display:inline-flex;gap:5px;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold-dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.empty{margin:auto;max-width:400px;text-align:center;padding:24px 8px;color:var(--ink-mute);line-height:1.8}
.empty .sigil{font-family:var(--f-display);color:var(--gold);font-size:13px;letter-spacing:.3em;margin-bottom:10px}
.empty h2{font-family:var(--f-body);font-weight:600;color:var(--ink);font-size:19px;margin:0 0 8px;text-wrap:balance}
.empty code{font-family:var(--f-ui);color:var(--gold);background:var(--hide-2);padding:1px 6px;border-radius:4px}

.composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--hide)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--night);border-radius:12px;
  padding:10px 13px;line-height:1.5;max-height:140px;font-family:var(--f-body);font-size:15px}
.composer textarea:focus{border-color:var(--gold-dim);outline:none}
.send{border:0;border-radius:12px;padding:0 18px;height:44px;cursor:pointer;font-weight:500;
  background:var(--gold);color:#1d150c}
.send:disabled{opacity:.4;cursor:default}

/* ── 설정 패널 ── */
.journal{height:100%;overflow-y:auto;border-left:1px solid var(--line);background:var(--hide);
  padding-block:0 24px;padding-inline:20px}
.journal-top{position:sticky;top:0;z-index:2;background:var(--hide)}
.journal-head{padding:16px 0 12px;
  border-bottom:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:space-between;gap:10px}
.journal-head h1{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.22em;color:var(--gold);font-weight:700}
.saved{font-size:11.5px;color:var(--ink-mute);transition:color .3s}
.saved.on{color:var(--gold)}
.sec{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.sec + .sec{margin-top:20px;border-top:1px solid var(--line)}
.sec-title{font-family:var(--f-display);font-size:11px;letter-spacing:.25em;color:var(--gold-dim);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.field label small{font-weight:400;color:var(--ink-mute);font-size:11.5px}
.field input[type=text],.field input[type=password],.field textarea{width:100%;border:1px solid var(--line);
  background:var(--night);border-radius:8px;padding:9px 11px;line-height:1.55;resize:vertical}
.field textarea{min-height:76px}
.field input:focus,.field textarea:focus{border-color:var(--gold-dim);outline:none}
.hint{font-size:11.5px;color:var(--ink-mute);line-height:1.55}
.hint a{color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--night);padding:9px 4px;cursor:pointer;color:var(--ink-mute);display:flex;flex-direction:column;gap:2px;align-items:center}
.seg button + button{border-left:1px solid var(--line)}
.seg button small{font-size:10.5px;opacity:.8}
.seg button[aria-pressed=true]{background:#2c2219;color:var(--gold)}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-mute);cursor:pointer}
.check input{accent-color:var(--gold)}
.avatar-pick{display:flex;align-items:center;gap:12px}
.avatar-pick .avatar{width:52px;height:52px;font-size:20px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink-mute);font-size:12.5px}
.ghost:hover{color:var(--gold);border-color:var(--gold-dim)}
.ghost.danger:hover{color:var(--danger);border-color:var(--danger)}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1;min-width:0}

/* 확인창 */
.confirm{position:fixed;inset:0;background:rgba(5,4,6,.7);display:grid;place-items:center;z-index:50;padding:16px}
.confirm .box{background:var(--hide);border:1px solid var(--gold-dim);border-radius:14px;padding:22px;max-width:340px;width:100%}
.confirm p{margin:0 0 18px;line-height:1.6;font-family:var(--f-body)}
.confirm .btn-row{justify-content:flex-end}
.confirm .yes{background:var(--danger);border-color:var(--danger);color:#fff}

/* 단톡 헤더: 겹친 아바타 */
.head-avatars{display:flex;flex:none}
.head-avatars .avatar{width:42px;height:42px;box-shadow:0 0 0 2px var(--night)}
.head-avatars.multi .avatar{width:34px;height:34px;font-size:14px}
.head-avatars.multi .avatar + .avatar{margin-left:-12px}
/* 파티(캐릭터 목록) */
.party{display:flex;gap:12px;overflow-x:auto;
  padding:14px 2px 10px;scrollbar-width:thin}
.member{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;border:0;background:none;
  cursor:pointer;color:var(--ink-mute);padding:0}
.member .avatar{width:46px;height:46px;font-size:18px;transition:box-shadow .15s,border-color .15s}
.member span{font-size:11.5px;max-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member[aria-current=true]{color:var(--gold)}
.member[aria-current=true] .avatar{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,163,90,.22),0 0 14px rgba(217,118,63,.35)}
.member:hover .avatar{border-color:var(--gold)}
.member:disabled{opacity:.45;cursor:default}
.member .face{border:0;background:none;padding:0;cursor:pointer;color:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;width:58px}
.member .slot{position:relative}
.member button:disabled{opacity:.45;cursor:default}
.member .join{position:absolute;right:-1px;top:28px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--gold-dim);background:var(--hide);color:transparent;font-size:12px;line-height:1;cursor:pointer;font-family:var(--f-ui)}
.member .join.on{background:var(--gold);border-color:var(--gold);color:#1d150c}
.member .join:hover{border-color:var(--gold)}
.member.resting .avatar{filter:grayscale(.7) brightness(.75)}
.party-hint{font-size:11px;color:var(--ink-mute);margin:0;padding:0 2px 12px;border-bottom:1px solid var(--line)}
.member.add .avatar{background:transparent;border:1.5px dashed var(--gold-dim);color:var(--gold-dim);font-family:var(--f-ui);font-size:24px;font-weight:300}
.member.add:hover .avatar{color:var(--gold);border-color:var(--gold)}

.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .only-narrow{display:inline-block}
  .journal{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);z-index:30;transform:translateX(105%);
    transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px)}
  .journal.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.5)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
  .stack{max-width:80%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <main class="chat">
    <header class="chat-head">
      <div class="head-avatars" id="headAvatars"></div>
      <div class="who">
        <div class="name" id="headName">동료</div>
        <div class="status" id="headStatus">모닥불 곁에 있음</div>
      </div>
      <button class="icon-btn" id="clearBtn" type="button">대화 초기화</button>
      <button class="icon-btn only-narrow" id="openJournal" type="button">설정</button>
    </header>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="말을 걸어보세요 · (괄호)로 상황 설명"></textarea>
      <button class="send" id="sendBtn" type="submit">보내기</button>
    </form>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="journal" id="journal" aria-label="캐릭터 설정">
    <div class="journal-top">
    <div class="journal-head">
      <h1>JOURNAL</h1>
      <span class="saved" id="saved">자동 저장됨</span>
      <button class="icon-btn only-narrow" id="closeJournal" type="button">닫기</button>
    </div>
    <nav class="party" id="party" aria-label="동료 목록"></nav>
    <p class="party-hint">사진을 누르면 설정 편집 · 오른쪽 아래 체크로 대화 참여</p>
    </div>

    <section class="sec">
      <div class="sec-title">Companion</div>
      <div class="avatar-pick">
        <div class="avatar" id="pickAvatar"></div>
        <div class="field" style="flex:1">
          <label for="charName">이름</label>
          <input type="text" id="charName" placeholder="예: 셰도우하트">
        </div>
      </div>
      <div class="btn-row">
        <label class="ghost" for="avatarFile" style="cursor:pointer">프로필 사진 고르기</label>
        <input type="file" id="avatarFile" accept="image/*" hidden>
        <button class="ghost" id="avatarClear" type="button">사진 지우기</button>
        <button class="ghost danger" id="charDelete" type="button">이 동료 삭제</button>
      </div>
      <label class="check"><input type="checkbox" id="joinChat"> 이 동료도 지금 대화에 참여</label>
      <div class="field">
        <label for="charSetting">1. 캐릭터 설정 <small>배경·외모·관계</small></label>
        <textarea id="charSetting" rows="4" placeholder="예: 샤의 성직자. 올챙이가 박힌 채 노틸로이드에서 탈출해 나와 함께 여행 중. 비밀이 많다."></textarea>
      </div>
      <div class="field">
        <label for="charPersona">2. 캐릭터 성격 <small>말투 포함</small></label>
        <textarea id="charPersona" rows="4" placeholder="예: 겉으론 차갑고 냉소적이지만 속정이 깊다. 반말, 건조한 농담."></textarea>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title">Your Tav</div>
      <div class="field">
        <label for="userChar">3. 내 캐릭터 설정 <small>모든 동료 공통</small></label>
        <textarea id="userChar" rows="3" placeholder="예: 이름 타브, 하프엘프 위저드. 수다스럽고 호기심이 많다."></textarea>
      </div>
      <div class="field">
        <label for="memory">4. 기억해야 할 것 <small>진행 상황·약속</small></label>
        <textarea id="memory" rows="4" placeholder="예: 1막 고블린 야영지 정리 완료. 어젯밤 모닥불에서 서로의 과거 얘기를 했음."></textarea>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title">Reply · 이 동료</div>
      <div class="field">
        <label>5. 답변 길이</label>
        <div class="seg" id="lengthSeg" role="group" aria-label="답변 길이">
          <button type="button" data-v="short">단문<small>1~2문장</small></button>
          <button type="button" data-v="mid">균형<small>3~5문장</small></button>
          <button type="button" data-v="long">장문<small>2~3문단</small></button>
        </div>
      </div>
      <div class="field">
        <label for="steer">6. 답변 유도 <small>선택</small></label>
        <textarea id="steer" rows="3" placeholder="예: 질투하는 티를 살짝 내줘 / 전투 직후라 지친 느낌으로"></textarea>
        <label class="check"><input type="checkbox" id="steerOnce"> 한 번 보내고 나면 비우기</label>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title">Gemini</div>
      <div class="field">
        <label for="apiKey">API 키</label>
        <div class="keyrow">
          <input type="password" id="apiKey" placeholder="AIza…" autocomplete="off">
          <button class="ghost" id="keyToggle" type="button">보기</button>
        </div>
        <p class="hint">무료 키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 발급. 키는 이 브라우저에만 저장돼요.</p>
      </div>
      <div class="field">
        <label for="model">모델</label>
        <input type="text" id="model" list="modelList" placeholder="gemini-3.5-flash-lite" autocomplete="off" spellcheck="false">
        <datalist id="modelList">
          <option value="gemini-3.5-flash-lite"></option>
          <option value="gemini-3.8-flash"></option>
          <option value="gemini-3.1-flash-lite"></option>
        </datalist>
        <p class="hint">기본은 <b>gemini-3.5-flash-lite</b>. 안 되면 <b>gemini-3.8-flash</b>로 바꿔보세요.</p>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title">Backup</div>
      <p class="hint">모든 동료의 설정과 대화가 이 브라우저에 자동 저장돼요. 백업 파일에는 동료 전원이 들어가요(API 키 제외).</p>
      <div class="btn-row">
        <button class="ghost" id="exportBtn" type="button">백업 파일 저장</button>
        <label class="ghost" for="importFile" style="cursor:pointer">백업 불러오기</label>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </section>
  </aside>
</div>

<div class="confirm" id="confirm" hidden>
  <div class="box">
    <p id="confirmText"></p>
    <div class="btn-row">
      <button class="ghost" id="confirmNo" type="button">취소</button>
      <button class="ghost yes" id="confirmYes" type="button">확인</button>
    </div>
  </div>
</div>

<script>
(() => {
  const KEY_S = "bg3rp.settings.v1", KEY_M = "bg3rp.messages.v1";       // 예전(1인) 저장 형식
  const KEY_G = "bg3rp.global.v2", KEY_C = "bg3rp.chars.v2", msgKey = id => "bg3rp.msgs.v2." + id;
  const GROUP = "group";                                                 // 단톡방 대화 키
  const HISTORY_LIMIT = 20; // API로 보내는 최근 메시지 수
  const $ = id => document.getElementById(id);

  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  const drop = k => { try { localStorage.removeItem(k); } catch {} };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function pick(o, keys){ const r = {}; keys.forEach(k => r[k] = o[k]); return r; }

  const CHAR_FIELDS = ["charName","avatar","charSetting","charPersona","memory","length","steer","steerOnce"];
  const charDefaults = { charName:"", avatar:"", charSetting:"", charPersona:"", memory:"", length:"short", steer:"", steerOnce:false };
  const globalDefaults = { userChar:"", apiKey:"", model:"gemini-3.5-flash-lite", order:[], editId:"", activeIds:[] };
  const defaults = { ...charDefaults, userChar:"", apiKey:"", model:"gemini-3.5-flash-lite" };

  let G = load(KEY_G, null), C = load(KEY_C, null);
  if (!G || !C){
    // 예전 1인 버전 데이터를 첫 동료로 옮김
    const old = Object.assign({}, defaults, load(KEY_S, {}));
    const id = newId();
    G = { ...globalDefaults, userChar:old.userChar, apiKey:old.apiKey, model:old.model || globalDefaults.model, order:[id], editId:id, activeIds:[id] };
    C = { [id]: pick(old, CHAR_FIELDS) };
    store(msgKey(id), load(KEY_M, []));
    store(KEY_G, G); store(KEY_C, C);
  }
  function normalizeG(){
    G = Object.assign({}, globalDefaults, G);
    G.order = (G.order || []).filter(id => C[id]);
    if (!G.order.length){ const id = newId(); C[id] = { ...charDefaults }; G.order = [id]; }
    if (!G.editId && G.activeId) G.editId = G.activeId;               // 이전 v2 형식
    if (!(G.activeIds || []).length && G.activeId) G.activeIds = [G.activeId];
    delete G.activeId;
    if (!C[G.editId]) G.editId = G.order[0];
    G.activeIds = (G.activeIds || []).filter(id => C[id]);
    if (!G.activeIds.length) G.activeIds = [G.editId];
    G.activeIds = G.order.filter(id => G.activeIds.includes(id));     // 파티 순서대로
  }
  normalizeG();

  let S = { ...defaults, ...G, ...C[G.editId] };   // 편집 중인 동료 + 공통 설정
  const roomKey = () => G.activeIds.length > 1 ? msgKey(GROUP) : msgKey(G.activeIds[0]);
  const isGroup = () => G.activeIds.length > 1;
  let M = load(roomKey(), []);
  let busy = false;
  const saveMsgs = () => store(roomKey(), M);
  const charOf = id => id === G.editId ? S : C[id];

  /* ── 설정 바인딩 ── */
  const textFields = ["charName","charSetting","charPersona","userChar","memory","steer","apiKey","model"];
  let savedTimer;
  function saveSettings(){
    G.userChar = S.userChar; G.apiKey = S.apiKey; G.model = S.model;
    C[G.editId] = pick(S, CHAR_FIELDS);
    const ok = store(KEY_G, G) && store(KEY_C, C);
    const el = $("saved");
    el.textContent = ok ? "저장됨" : "저장 실패 (저장공간 확인)";
    el.classList.add("on");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => { el.classList.remove("on"); el.textContent = "자동 저장됨"; }, 1200);
  }
  textFields.forEach(f => {
    const el = $(f); el.value = S[f] || "";
    el.addEventListener("input", () => { S[f] = el.value; saveSettings(); if (f === "charName") paintIdentity(); });
  });
  $("steerOnce").checked = !!S.steerOnce;
  $("steerOnce").addEventListener("change", e => { S.steerOnce = e.target.checked; saveSettings(); });
  function paintSeg(){ document.querySelectorAll("#lengthSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === S.length))); }
  document.querySelectorAll("#lengthSeg button").forEach(b => b.addEventListener("click", () => { S.length = b.dataset.v; paintSeg(); saveSettings(); }));
  paintSeg();
  $("keyToggle").addEventListener("click", () => {
    const i = $("apiKey"); const show = i.type === "password"; i.type = show ? "text" : "password"; $("keyToggle").textContent = show ? "숨김" : "보기";
  });

  /* ── 아바타·이름 ── */
  const nameOf = (c = S) => ((c && c.charName) || "").trim() || "동료";
  function fillAvatar(el, c = S){
    el.innerHTML = "";
    if (c && c.avatar){ const img = new Image(); img.src = c.avatar; img.alt = ""; el.appendChild(img); }
    else el.textContent = nameOf(c).slice(0,1);
  }
  // 메시지의 화자: 단톡은 m.who, 1:1은 그 방의 동료
  function speakerOf(m){
    const id = m.who || (!isGroup() ? G.activeIds[0] : null);
    const c = id && charOf(id);
    return c || { charName: m.name || "떠난 동료", avatar:"" };
  }
  const roomName = () => G.activeIds.map(id => nameOf(charOf(id))).join(", ");
  const idleStatus = () => isGroup() ? `모닥불 곁에 ${G.activeIds.length}명` : "모닥불 곁에 있음";

  function paintHead(){
    const box = $("headAvatars"); box.innerHTML = "";
    box.classList.toggle("multi", isGroup());
    G.activeIds.slice(0, 4).forEach(id => { const a = document.createElement("div"); a.className = "avatar"; fillAvatar(a, charOf(id)); box.appendChild(a); });
    $("headName").textContent = roomName();
    if (!busy) $("headStatus").textContent = idleStatus();
  }
  function paintIdentity(){
    fillAvatar($("pickAvatar"));
    $("joinChat").checked = G.activeIds.includes(G.editId);
    paintHead(); paintParty();
    if (!busy) render();
  }
  $("avatarFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const c = document.createElement("canvas"); const n = 128; c.width = c.height = n;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, n, n);
      S.avatar = c.toDataURL("image/jpeg", .85); URL.revokeObjectURL(url); saveSettings(); paintIdentity();
    };
    img.src = url; e.target.value = "";
  });
  $("avatarClear").addEventListener("click", () => { S.avatar = ""; saveSettings(); paintIdentity(); });

  /* ── 채팅 렌더 ── */
  const log = $("log");
  const fmtTime = ts => { const d = new Date(ts); let h = d.getHours(); const ap = h < 12 ? "오전" : "오후"; h = h % 12 || 12; return `${ap} ${h}:${String(d.getMinutes()).padStart(2,"0")}`; };
  const fmtDay = ts => new Date(ts).toLocaleDateString("ko-KR", { year:"numeric", month:"long", day:"numeric", weekday:"long" });
  const sameMinute = (a,b) => Math.floor(a/60000) === Math.floor(b/60000);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const richText = s => esc(s).replace(/\*([^*\n]+)\*/g, "<em>$1</em>"); // *행동 묘사* 이탤릭
  const sameSpeaker = (a, b) => a && b && a.role === b.role && (a.role === "user" || (a.who || "") === (b.who || ""));

  function render(){
    log.innerHTML = "";
    if (!M.length){
      log.innerHTML = isGroup()
        ? `<div class="empty"><div class="sigil">· · ✦ · ·</div>
          <h2>${esc(roomName())}</h2>
          모두 모닥불 곁에 모였어요. 한마디 던지면 각자 자기 방식대로 대답해요.<br>
          게임 상황은 <code>(방금 고블린 떼를 처치함)</code>처럼 괄호로 알려주면 돼요.</div>`
        : `<div class="empty"><div class="sigil">· · ✦ · ·</div>
          <h2>오늘 밤 모닥불엔 누가 앉아 있나요</h2>
          오른쪽 일지에 동료 설정과 Gemini API 키를 적고 말을 걸어보세요.<br>
          게임 상황은 <code>(방금 고블린 떼를 처치함)</code>처럼 괄호로 알려주면 돼요.</div>`;
      return;
    }
    let lastDay = "";
    const lastUser = M.map(m => m.role).lastIndexOf("user");
    M.forEach((m, i) => {
      const day = new Date(m.ts).toDateString();
      if (day !== lastDay){ const d = document.createElement("div"); d.className = "day"; d.textContent = fmtDay(m.ts); log.appendChild(d); lastDay = day; }
      const prev = M[i-1], next = M[i+1];
      const start = !sameSpeaker(prev, m) || !sameMinute(prev.ts, m.ts) || new Date(prev.ts).toDateString() !== day;
      const end = !sameSpeaker(next, m) || !sameMinute(next.ts, m.ts);
      log.appendChild(rowEl(m, start, end, i === M.length - 1, i > lastUser));
    });
    log.scrollTop = log.scrollHeight;
  }

  function rowEl(m, start, end, isLast, inLastTurn){
    const me = m.role === "user";
    const who = me ? null : speakerOf(m);
    const row = document.createElement("div");
    row.className = `row ${me ? "me" : "them"}${start ? " grp-start" : ""}`;
    if (!me){
      if (start){ const a = document.createElement("div"); a.className = "avatar"; fillAvatar(a, who); row.appendChild(a); }
      else { const sp = document.createElement("div"); sp.className = "spacer"; row.appendChild(sp); }
    }
    const stack = document.createElement("div"); stack.className = "stack";
    if (!me && start){ const n = document.createElement("div"); n.className = "sender"; n.textContent = nameOf(who); stack.appendChild(n); }
    const line = document.createElement("div"); line.className = "line";
    const b = document.createElement("div"); b.className = "bubble"; b.innerHTML = richText(m.text);
    line.appendChild(b);
    if (end || (!me && isLast)){
      const meta = document.createElement("div"); meta.className = "meta";
      if (!me && isLast && !busy){
        const r = document.createElement("button"); r.type = "button"; r.className = "reroll";
        r.textContent = "↻ 다시"; r.title = inLastTurn && isGroup() ? "이번 차례 답변 전부 다시 받기" : "이 답변 다시 받기";
        r.addEventListener("click", reroll); meta.appendChild(r);
      }
      if (end){ const t = document.createElement("span"); t.textContent = fmtTime(m.ts); meta.appendChild(t); }
      if (!me && isLast && m.stats){
        const st = document.createElement("span"); st.className = "stats";
        const st_ = m.stats;
        st.textContent = `${st_.sec.toFixed(1)}초${st_.firstSec != null ? ` (첫 글자 ${st_.firstSec.toFixed(1)}초)` : ""}${st_.thoughts ? ` · 생각 ${st_.thoughts}토큰` : ""}`;
        st.title = `모델 ${st_.model} · 생각 수준 ${st_.level}`;
        meta.appendChild(st);
      }
      line.appendChild(meta);
    }
    stack.appendChild(line); row.appendChild(stack);
    return row;
  }

  /* 답을 받는 동안 보이는 임시 말풍선들 */
  function liveRow(c, text){
    const row = document.createElement("div"); row.className = "row them grp-start";
    const a = document.createElement("div"); a.className = "avatar"; fillAvatar(a, c); row.appendChild(a);
    const st = document.createElement("div"); st.className = "stack";
    st.innerHTML = `<div class="sender">${esc(nameOf(c))}</div><div class="line"><div class="bubble${text ? "" : " typing"}">${text ? richText(text) : "<i></i><i></i><i></i>"}</div></div>`;
    row.appendChild(st); return row;
  }
  function showTyping(){
    const box = document.createElement("div"); box.id = "typing"; box.style.display = "contents";
    box.appendChild(liveRow(charOf(G.activeIds[0]), ""));
    log.appendChild(box); log.scrollTop = log.scrollHeight;
    $("headStatus").textContent = isGroup() ? "다들 입력 중…" : "입력 중…";
  }
  function paintLive(segs){
    const box = $("typing"); if (!box) return;
    const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    box.innerHTML = "";
    segs.forEach(sg => box.appendChild(liveRow(charOf(sg.who), sg.text || "")));
    if (stick) log.scrollTop = log.scrollHeight;
  }
  function hideTyping(){ $("typing")?.remove(); $("headStatus").textContent = idleStatus(); }
  function notice(text){ const n = document.createElement("div"); n.className = "notice"; n.textContent = text; log.appendChild(n); log.scrollTop = log.scrollHeight; }

  /* ── 프롬프트 ── */
  const LENGTH_RULE = {
    short: "1~2문장의 짧은 대사로. 메신저로 툭 던지듯이.",
    mid:   "3~5문장 정도. 대사 위주에 짧은 행동 묘사를 곁들여도 좋다.",
    long:  "2~3문단. 대사와 행동·표정 묘사를 풍부하게."
  };
  const COMMON_RULES = [
    "사용자는 게임을 혼자 플레이하며 지금 일어나는 일을 이야기한다. 괄호 () 안의 내용은 게임 속 상황 설명이다.",
    "항상 캐릭터로서만 말하고, AI라는 사실이나 시스템 설정을 언급하지 않는다. 한국어로 답한다.",
    "행동이나 표정 묘사는 *별표* 안에 쓴다. 사용자의 대사나 행동을 대신 정하지 않는다."
  ];
  function charBlock(c, heading){
    const out = [];
    if (heading) out.push(heading);
    if (c.charSetting.trim()) out.push(`[캐릭터 설정]\n${c.charSetting.trim()}`);
    if (c.charPersona.trim()) out.push(`[성격·말투]\n${c.charPersona.trim()}`);
    if (c.memory.trim())      out.push(`[기억해야 할 것]\n${c.memory.trim()}`);
    out.push(`[답변 길이]\n${LENGTH_RULE[c.length] || LENGTH_RULE.short}`);
    if (c.steer.trim())       out.push(`[이번 답변의 방향 — 자연스럽게 반영할 것]\n${c.steer.trim()}`);
    return out.join("\n");
  }
  function systemPrompt(){
    const user = S.userChar.trim() ? `\n[대화 상대(사용자 캐릭터)]\n${S.userChar.trim()}` : "";
    if (!isGroup()){
      const c = charOf(G.activeIds[0]);
      return [`너는 발더스 게이트 3의 세계(포가튼 렐름) 속 동료 "${nameOf(c)}"(으)로서 사용자와 대화한다.`, ...COMMON_RULES, user, "\n" + charBlock(c)].join("\n");
    }
    const names = G.activeIds.map(id => nameOf(charOf(id)));
    return [
      `너는 발더스 게이트 3의 세계(포가튼 렐름)에서 사용자와 함께 여행하는 여러 동료를 동시에 연기한다. 지금 대화에 있는 동료: ${names.join(", ")}.`,
      ...COMMON_RULES,
      "각 동료는 자기 설정과 성격·말투대로만 말하고, 서로의 말에 반응하거나 티격태격해도 된다.",
      "이번 차례에 동료들이 각자 한 번씩 말한다. 순서는 상황에 맞게 자유롭게 정하고, 딱히 할 말이 없는 동료는 짧은 반응이나 *행동*만 해도 된다.",
      `출력 형식(반드시 지킬 것): 각 동료의 발언은 새 줄에서 【이름】으로 시작하고 그 뒤에 대사를 쓴다. 예: 【${names[0]}】 *팔짱을 낀다* 그래서?`,
      "【】 밖에 해설이나 다른 말을 쓰지 않는다. 사용자 캐릭터의 대사는 쓰지 않는다.",
      user,
      ...G.activeIds.map(id => "\n" + charBlock(charOf(id), `===== 동료: ${nameOf(charOf(id))} =====`))
    ].join("\n");
  }
  function buildContents(){
    const out = [], grp = isGroup();
    M.slice(-HISTORY_LIMIT).forEach(m => {
      const role = m.role === "user" ? "user" : "model";
      const text = role === "model" && grp ? `【${nameOf(speakerOf(m))}】 ${m.text}` : m.text;
      const last = out[out.length-1];
      if (last && last.role === role) last.parts[0].text += "\n" + text;
      else out.push({ role, parts:[{ text }] });
    });
    while (out.length && out[0].role !== "user") out.shift();
    return out;
  }

  // 단톡 응답 "【이름】 대사" → [{who, text}]
  function splitGroup(raw){
    const ids = G.activeIds, byName = new Map();
    ids.forEach(id => { const n = nameOf(charOf(id)); if (!byName.has(n)) byName.set(n, id); });
    const find = n => {
      n = n.trim();
      if (byName.has(n)) return byName.get(n);
      for (const [k, id] of byName) if (n.includes(k) || k.includes(n)) return id;
      return null;
    };
    const segs = []; let cur = null;
    raw.split("\n").forEach(line => {
      const mm = line.match(/^\s*(?:\*\*)?【([^】]{1,40})】(?:\*\*)?\s*(.*)$/);
      const who = mm && find(mm[1]);
      if (mm && who){ cur = { who, text: mm[2] }; segs.push(cur); }
      else if (cur) cur.text += "\n" + line;
      else if (line.trim()){ cur = { who: ids[0], text: line }; segs.push(cur); }
    });
    segs.forEach(sg => sg.text = sg.text.trim());
    return segs;
  }

  // "models/Gemini 2.5 Flash " → "gemini-2.5-flash"
  function normModel(raw){
    let m = String(raw || "").trim().replace(/^.*models\//i, "").replace(/:.*$/, "")
      .replace(/[​-‍﻿]/g, "").toLowerCase().replace(/\s+/g, "-");
    return m || "gemini-3.5-flash-lite";
  }

  const noMinimal = new Set();
  const blockMsg = code => `구글 쪽 기본 차단에 걸렸어요 (${code}). 앱에서 끌 수 없는 부분이라, 표현을 조금 바꾸거나 ↻ 다시 받아보세요.`;

  // 스트리밍 호출: 글자가 오는 대로 onDelta(전체텍스트) 호출
  async function askGemini(onDelta){
    const key = S.apiKey.trim(), model = normModel(S.model);
    if (!key) throw new Error("오른쪽 일지의 Gemini 칸에 API 키를 먼저 넣어주세요.");
    if (!/^[a-z0-9][a-z0-9.\-]*$/.test(model)) throw new Error(`모델 이름 "${S.model}"을(를) 알아볼 수 없어요. gemini-3.5-flash-lite 처럼 영문 소문자로 적어주세요.`);
    const per = G.activeIds.some(id => charOf(id).length === "long") ? 4096 : 2048;
    const gen = { temperature:1.0, maxOutputTokens: Math.min(8192, per * G.activeIds.length) };
    if (/2\.5-flash/.test(model)) gen.thinkingConfig = { thinkingBudget:0 };
    else if (/^gemini-3/.test(model)) gen.thinkingConfig = { thinkingLevel: noMinimal.has(model) ? "low" : "minimal" };
    const safety = ["HARM_CATEGORY_HARASSMENT","HARM_CATEGORY_HATE_SPEECH","HARM_CATEGORY_SEXUALLY_EXPLICIT","HARM_CATEGORY_DANGEROUS_CONTENT","HARM_CATEGORY_CIVIC_INTEGRITY"]
      .map(category => ({ category, threshold:"OFF" }));

    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 90000);
    const t0 = performance.now();
    let res;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`, {
        method:"POST", signal:ctrl.signal,
        headers:{ "Content-Type":"application/json", "x-goog-api-key":key },
        body: JSON.stringify({ systemInstruction:{ parts:[{ text:systemPrompt() }] }, contents:buildContents(), generationConfig:gen, safetySettings:safety })
      });
    } catch (e) {
      clearTimeout(timer);
      throw new Error(e.name === "AbortError" ? "90초 동안 응답이 없어서 멈췄어요. 다시 보내보세요." : "구글 서버에 연결하지 못했어요. 인터넷 연결을 확인해주세요.");
    }

    if (!res.ok){
      clearTimeout(timer);
      let data = {}; try { data = await res.json(); } catch {}
      if (Array.isArray(data)) data = data[0] || {};
      const msg = data?.error?.message || res.statusText;
      if (res.status === 400 && gen.thinkingConfig?.thinkingLevel === "minimal" && /think/i.test(msg)){ noMinimal.add(model); return askGemini(onDelta); }
      if (res.status === 503 || res.status === 500 || /overload|high demand|unavailable/i.test(msg)){ const e = new Error("OVERLOADED"); e.overloaded = true; throw e; }
      if (res.status === 429) throw new Error("내 키의 무료 사용량 한도에 걸렸어요. 1분쯤 쉬었다가 보내보세요. 오늘 하루 한도를 다 쓴 거라면 내일 다시 풀려요.");
      if (res.status === 400 && /API key/i.test(msg)) throw new Error("API 키가 올바르지 않아요. AI Studio에서 복사한 키를 다시 확인해주세요.");
      if (res.status === 404) throw new Error(`"${model}" 모델을 찾을 수 없어요. gemini-3.5-flash-lite 로 바꿔보세요.`);
      throw new Error(`Gemini 오류 (${res.status}): ${msg}`);
    }

    const reader = res.body.getReader(); const dec = new TextDecoder();
    let buf = "", text = "", first = 0, usage = null, finish = "", block = "";
    try {
      for (;;){
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line.startsWith("data:")) continue;
          let chunk; try { chunk = JSON.parse(line.slice(5)); } catch { continue; }
          if (chunk.promptFeedback?.blockReason) block = chunk.promptFeedback.blockReason;
          if (chunk.usageMetadata) usage = chunk.usageMetadata;
          const cand = chunk.candidates?.[0];
          if (cand?.finishReason) finish = cand.finishReason;
          const piece = (cand?.content?.parts || []).filter(p => !p.thought && p.text).map(p => p.text).join("");
          if (piece){ if (!first) first = performance.now(); text += piece; onDelta(text); }
        }
      }
    } catch (e) {
      if (e.name === "AbortError" && !text) throw new Error("90초 동안 응답이 없어서 멈췄어요. 다시 보내보세요.");
    } finally { clearTimeout(timer); }

    text = text.trim();
    if (block) throw new Error(blockMsg(block));
    if (!text){
      if (finish && finish !== "STOP" && finish !== "MAX_TOKENS") throw new Error(blockMsg(finish));
      throw new Error("빈 답이 돌아왔어요. ↻ 다시 받아보거나 한 번 더 보내주세요.");
    }
    const stats = { sec: (performance.now() - t0) / 1000, firstSec: first ? (first - t0) / 1000 : null,
      thoughts: usage?.thoughtsTokenCount || 0, model, level: gen.thinkingConfig?.thinkingLevel ?? (gen.thinkingConfig ? "off" : "기본") };
    console.log("[campfire] 응답 통계", stats, usage);
    return { text, stats };
  }

  async function respond(){
    busy = true; $("sendBtn").disabled = true; paintParty(); render(); showTyping();
    const grp = isGroup();
    const onDelta = t => paintLive(grp ? splitGroup(t) : [{ who: G.activeIds[0], text: t }]);
    try {
      // 서버 과부하(503)면 잠깐 쉬었다가 자동 재시도
      let out, tries = 0; const waits = [3, 8, 15];
      for (;;){
        try { out = await askGemini(onDelta); break; }
        catch (e) {
          if (!e.overloaded) throw e;
          if (tries >= waits.length) throw new Error("구글 서버가 붐벼서 여러 번 시도했는데도 답을 못 받았어요. 몇 분 뒤에 ↻ 다시 보내거나, 모델을 gemini-3.1-flash-lite로 바꿔보세요.");
          const w = waits[tries++];
          for (let i = w; i > 0; i--){ $("headStatus").textContent = `서버가 붐벼요 · ${i}초 뒤 다시 시도 (${tries}/${waits.length})`; await new Promise(r => setTimeout(r, 1000)); }
          $("headStatus").textContent = grp ? "다들 입력 중…" : "입력 중…";
        }
      }
      const { text, stats } = out, ts = Date.now();
      const segs = (grp ? splitGroup(text) : [{ who: G.activeIds[0], text }]).filter(sg => sg.text);
      if (!segs.length) throw new Error("빈 답이 돌아왔어요. ↻ 다시 받아보거나 한 번 더 보내주세요.");
      segs.forEach((sg, i) => M.push({ role:"model", who: sg.who, name: nameOf(charOf(sg.who)), text: sg.text, ts, ...(i === segs.length - 1 ? { stats } : {}) }));
      saveMsgs();
      // "한 번 보내고 비우기"가 켜진 동료의 답변 유도 비우기
      G.activeIds.forEach(id => {
        const c = charOf(id);
        if (c.steerOnce && c.steer){ c.steer = ""; if (id === G.editId) $("steer").value = ""; }
      });
      saveSettings();
    } catch (err) {
      hideTyping(); busy = false; $("sendBtn").disabled = false; paintParty(); render(); notice(err.message || "알 수 없는 오류가 났어요.");
      return;
    }
    hideTyping(); busy = false; $("sendBtn").disabled = false; paintParty(); render();
  }

  async function send(){
    const t = $("input").value.trim(); if (!t || busy) return;
    M.push({ role:"user", text:t, ts:Date.now() }); saveMsgs();
    $("input").value = ""; autosize();
    await respond();
  }
  async function reroll(){
    if (busy || !M.length || M[M.length-1].role !== "model") return;
    while (M.length && M[M.length-1].role === "model") M.pop();   // 이번 차례 답변 전부
    saveMsgs(); await respond();
  }

  /* ── 입력 ── */
  const input = $("input");
  function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); send(); }
  });
  $("composer").addEventListener("submit", e => { e.preventDefault(); send(); });

  /* ── 확인창 ── */
  let pendingYes = null;
  const closeAsk = () => { $("confirm").hidden = true; pendingYes = null; };
  function ask(text, onYes){
    pendingYes = onYes;
    $("confirmText").textContent = text; $("confirm").hidden = false; $("confirmYes").focus();
  }
  $("confirmYes").addEventListener("click", () => { const f = pendingYes; closeAsk(); if (f) f(); });
  $("confirmNo").addEventListener("click", closeAsk);
  $("confirm").addEventListener("click", e => { if (e.target === $("confirm")) closeAsk(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("confirm").hidden) closeAsk(); });
  $("clearBtn").addEventListener("click", () => {
    if (busy) return;
    const what = isGroup() ? "단체 대화방의 대화를" : `${roomName()}와(과)의 대화를`;
    ask(`${what} 모두 지울까요? 캐릭터 설정은 그대로 남아요.`, () => { M = []; saveMsgs(); render(); });
  });

  /* ── 백업 ── */
  $("exportBtn").addEventListener("click", () => {
    saveSettings();
    const msgs = {}; G.order.forEach(id => msgs[id] = load(msgKey(id), [])); msgs[GROUP] = load(msgKey(GROUP), []);
    const data = { version:3, global:{ ...G, apiKey:"" }, chars:C, messages:msgs };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `campfire-party-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("importFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    if (busy) return notice("답을 받는 중에는 불러올 수 없어요. 답이 온 뒤에 다시 해주세요.");
    let d; try { d = JSON.parse(await f.text()); } catch { return notice("백업 파일을 읽지 못했어요. 이 앱에서 저장한 .json 파일인지 확인해주세요."); }
    if (d && d.chars && d.global){
      ask("백업을 불러오면 지금 동료들과 대화가 전부 백업 내용으로 바뀌어요. API 키는 유지돼요.", () => {
        G.order.forEach(id => drop(msgKey(id))); drop(msgKey(GROUP));
        const key = S.apiKey;
        C = d.chars; G = Object.assign({}, d.global, { apiKey:key });
        normalizeG();
        const mm = d.messages || {};
        G.order.forEach(id => store(msgKey(id), mm[id] || []));
        store(msgKey(GROUP), mm[GROUP] || []);
        store(KEY_G, G); store(KEY_C, C);
        reloadAll();
      });
    } else if (d && d.settings){
      // 예전 1인 백업 → 새 동료로 추가
      ask("예전 형식의 백업이에요. 새 동료로 추가할게요.", () => {
        const id = newId();
        C[id] = pick(Object.assign({}, charDefaults, d.settings), CHAR_FIELDS);
        store(msgKey(id), Array.isArray(d.messages) ? d.messages : []);
        G.order.push(id); saveSettings();
        editChar(id);
      });
    } else notice("백업 파일을 읽지 못했어요. 이 앱에서 저장한 .json 파일인지 확인해주세요.");
  });

  /* ── 파티: 편집 선택 · 대화 참여 · 추가 · 삭제 ── */
  function paintParty(){
    const nav = $("party"); nav.innerHTML = "";
    G.order.forEach(id => {
      const c = charOf(id), on = G.activeIds.includes(id);
      const b = document.createElement("div"); b.className = "member" + (on ? "" : " resting");
      b.setAttribute("aria-current", String(id === G.editId));
      const face = document.createElement("button"); face.type = "button"; face.className = "face";
      face.title = `${nameOf(c)} 설정 편집`; face.disabled = busy;
      const av = document.createElement("div"); av.className = "avatar"; fillAvatar(av, c);
      const nm = document.createElement("span"); nm.textContent = nameOf(c);
      face.append(av, nm);
      face.addEventListener("click", () => editChar(id));
      const j = document.createElement("button"); j.type = "button"; j.className = "join" + (on ? " on" : "");
      j.textContent = "✓"; j.disabled = busy;
      j.setAttribute("aria-pressed", String(on));
      j.setAttribute("aria-label", `${nameOf(c)} 대화 참여`);
      j.title = on ? "대화에서 빼기" : "대화에 참여시키기";
      j.addEventListener("click", ev => { ev.stopPropagation(); toggleJoin(id); });
      const wrap = document.createElement("div"); wrap.className = "slot";
      wrap.append(face, j);
      b.appendChild(wrap);
      nav.appendChild(b);
    });
    const add = document.createElement("button"); add.type = "button"; add.className = "member add"; add.disabled = busy;
    add.innerHTML = `<div class="avatar">+</div><span>동료 추가</span>`;
    add.addEventListener("click", addChar);
    nav.appendChild(add);
    $("charDelete").disabled = busy || G.order.length < 2;
    $("joinChat").disabled = busy;
  }
  // 오른쪽 설정 칸에 띄울 동료 고르기 (대화방은 그대로)
  function editChar(id, force){
    if (busy) return;
    if (id === G.editId && !force) return;
    if (!force) saveSettings();
    G.editId = id; store(KEY_G, G);
    S = { ...defaults, ...G, ...C[id] };
    textFields.forEach(k => $(k).value = S[k] || ""); $("steerOnce").checked = !!S.steerOnce;
    paintSeg(); paintIdentity();
    $("party").querySelector('[aria-current="true"]')?.scrollIntoView({ block:"nearest", inline:"nearest" });
  }
  // 대화 참여 켜고 끄기 → 1명이면 1:1 방, 2명 이상이면 단톡방
  function toggleJoin(id, want){
    if (busy) return;
    const on = G.activeIds.includes(id);
    if (want === undefined) want = !on;
    if (want === on) return;
    if (!want && G.activeIds.length === 1){ notice("대화에는 최소 한 명은 있어야 해요. 다른 동료를 먼저 참여시켜주세요."); $("joinChat").checked = true; return; }
    saveSettings();
    G.activeIds = want ? G.order.filter(x => x === id || G.activeIds.includes(x)) : G.activeIds.filter(x => x !== id);
    store(KEY_G, G);
    M = load(roomKey(), []);
    paintIdentity();
  }
  $("joinChat").addEventListener("change", e => toggleJoin(G.editId, e.target.checked));
  function reloadAll(){
    S = { ...defaults, ...G, ...C[G.editId] };
    M = load(roomKey(), []);
    textFields.forEach(k => $(k).value = S[k] || ""); $("steerOnce").checked = !!S.steerOnce;
    paintSeg(); paintIdentity();
  }
  function addChar(){
    if (busy) return;
    const id = newId();
    C[id] = { ...charDefaults }; G.order.push(id);
    store(KEY_C, C); store(msgKey(id), []);
    editChar(id);
    $("charName").focus();
  }
  $("charDelete").addEventListener("click", () => {
    if (busy || G.order.length < 2) return;
    ask(`${nameOf()}을(를) 파티에서 내보낼까요? 이 동료의 설정과 1:1 대화가 모두 지워지고 되돌릴 수 없어요.`, () => {
      const id = G.editId, i = G.order.indexOf(id);
      G.order.splice(i, 1); delete C[id]; drop(msgKey(id));
      G.activeIds = G.activeIds.filter(x => x !== id);
      G.editId = G.order[Math.max(0, i - 1)];
      if (!G.activeIds.length) G.activeIds = [G.editId];
      store(KEY_G, G); store(KEY_C, C);
      reloadAll();
    });
  });

  /* ── 모바일 서랍 ── */
  const openJ = v => { $("journal").classList.toggle("open", v); $("scrim").classList.toggle("open", v); };
  $("openJournal").addEventListener("click", () => openJ(true));
  $("closeJournal").addEventListener("click", () => openJ(false));
  $("scrim").addEventListener("click", () => openJ(false));

  paintIdentity(); autosize();
})();
</script>
</body>
